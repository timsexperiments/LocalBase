# SPDX licensing for the tree, so per-file headers aren't needed on existing
# files. New source files carry their own SPDX headers.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "TimsExperiments"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "go/internal/third_party/norm/**"
precedence = "override"
SPDX-FileCopyrightText = "The Go Authors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "go/internal/web/static/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Big Sky Software"
SPDX-License-Identifier = "0BSD"

# Compiled output that includes Tailwind CSS.
[[annotations]]
path = "go/internal/web/static/app.css"
precedence = "override"
SPDX-FileCopyrightText = ["TimsExperiments", "Tailwind Labs, Inc."]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"
