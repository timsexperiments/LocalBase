name: Bug report
description: Report a reproducible problem with LocalBase.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, tokens or private prompts. For security problems, report privately instead.
  - type: input
    id: version
    attributes:
      label: LocalBase version
      description: The output of `local-base --version`.
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `local-base doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [Install script, Homebrew, Release archive, Built from source]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: |
        `local-base logs --level error` for relevant lines. `local-base diagnostics` creates a redacted ZIP you can attach; look through it first. It holds hardware details, configuration shape, model names and recent log events.
