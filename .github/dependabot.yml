version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # The store runs on SQLite in write-ahead-log mode, and its locking depends on the exact
      # SQLite build. Bump this by hand only, after re-running the WAL checks on the new version:
      # the soak, the second-process shape test and the guard test.
      - dependency-name: modernc.org/sqlite
      # SQLite is built against an exact libc version, and libc carries the allocator behind the
      # gateway's measured memory growth. So a libc bump on its own also needs the WAL checks
      # above, and a memory measurement, before it lands.
      - dependency-name: modernc.org/libc
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directories: [/, /runtimes/kokoro]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      bun:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /go/test/platform/systemd-check]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
