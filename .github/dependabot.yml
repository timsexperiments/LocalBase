version: 2
updates:
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directories: [/, /runtimes/kokoro]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      bun:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /go/tools/systemd-check]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
