name: Package Kokoro Runtime

on:
  pull_request:
    paths:
      - .github/workflows/release-kokoro.yml
      - runtimes/kokoro/**
      - scripts/kokoro*
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable Kokoro runtime family tag
        required: true
        default: kokoro-v0.0.1
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install repository tooling
        run: bun install --frozen-lockfile
      - name: Require main for publication
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Kokoro runtime releases may only be dispatched from main."
          exit 1
      - name: Validate immutable family tag
        run: bun run scripts/kokoro-release.ts validate-tag --tag "${{ inputs.runtime_tag || 'kokoro-v0.0.1' }}"
      - name: Reject existing release or tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/kokoro-release.ts assert-unpublished --repository "$GITHUB_REPOSITORY" --tag "${{ inputs.runtime_tag }}"
      - name: Test converter and packaged contract
        run: bun test scripts/kokoro-release.test.ts

  package:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install repository tooling
        run: bun install --frozen-lockfile
      - name: Verify and unpack official prebuilt Bun
        run: bun run scripts/kokoro-release.ts prepare --target "${{ matrix.target }}" --directory dist/kokoro/package
      - name: Install frozen runtime dependencies without lifecycle scripts
        run: bun run scripts/kokoro-release.ts install --target "${{ matrix.target }}" --directory dist/kokoro/package
      - name: Verify actual prebuilt and dependency files against locked registry archives
        run: bun run scripts/kokoro-release.ts verify-dependencies --target "${{ matrix.target }}" --directory dist/kokoro/package
      - name: Typecheck packaging and sidecar
        run: bunx tsgo --noEmit --project scripts/kokoro-runtime-tsconfig.json
      - name: Check source formatting
        run: bunx prettier --check scripts/kokoro* runtimes/kokoro/*.ts runtimes/kokoro/*.json .github/workflows/release-kokoro.yml
      - name: Package sidecar and complete asset inventory
        run: bun run scripts/kokoro-release.ts package --target "${{ matrix.target }}" --directory dist/kokoro/package --output release
      - name: Qualify relocated actual entrypoint offline with no host Bun on PATH
        run: bun run scripts/kokoro-release.ts qualify --target "${{ matrix.target }}" --directory release
      - name: Upload qualified runtime package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kokoro-runtime-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  stage:
    name: Stage qualified Kokoro release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install repository tooling
        run: bun install --frozen-lockfile
      - name: Download qualified runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kokoro-runtime-*
          merge-multiple: true
          path: release
      - name: Stage both qualified packages and immutable release manifest
        run: bun run scripts/kokoro-release.ts stage --directory release --tag "${{ inputs.runtime_tag || 'kokoro-v0.0.1' }}"
      - name: Upload staged release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kokoro-runtime-release
          path: |
            release/kokoro-tts-linux-x64.tar.gz
            release/kokoro-tts-macos-arm64.tar.gz
            release/kokoro-runtime-manifest.json
            release/checksums.txt
          if-no-files-found: error

  release:
    name: Publish qualified Kokoro runtime
    needs: stage
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUNTIME_TAG: ${{ inputs.runtime_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install repository tooling
        run: bun install --frozen-lockfile
      - name: Reject existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/kokoro-release.ts assert-unpublished --repository "$GITHUB_REPOSITORY" --tag "$RUNTIME_TAG"
      - name: Download staged release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kokoro-runtime-release
          path: release
      - name: Verify staged runtime checksums
        run: |
          cd release
          sha256sum --check --strict checksums.txt
      - name: Attest runtime archives, manifest and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/kokoro-tts-macos-arm64.tar.gz
            release/kokoro-tts-linux-x64.tar.gz
            release/kokoro-runtime-manifest.json
            release/checksums.txt
      - name: Publish immutable Kokoro release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RUNTIME_TAG"
          release/kokoro-tts-macos-arm64.tar.gz
          release/kokoro-tts-linux-x64.tar.gz
          release/kokoro-runtime-manifest.json release/checksums.txt
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RUNTIME_TAG" --latest=false
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run scripts/kokoro-release.ts verify-published
          --repository "$GITHUB_REPOSITORY" --tag "$RUNTIME_TAG"
          --output "$RUNNER_TEMP/kokoro-release-receipt.json"
