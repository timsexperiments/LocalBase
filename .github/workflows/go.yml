name: Go rewrite

# No paths filter: go-checks is meant to be a required check, and a required check that never
# starts blocks the merge. The scope job decides instead, and the test jobs skip when nothing of
# the Go tree changed (a skipped job satisfies a required check).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, rewrite/go]

permissions:
  contents: read

env:
  # A runner has no other work on it, so tests get a wide block to pick from.
  LOCALBASE_TEST_PORTS: 24000-29999
  # internal/backup's tests that copy, sync and measure large files. They run without -race, in
  # backup-files: -race makes them 4-21 times slower and adds little to what they test. They run on
  # macOS too, since SQLite's locking and -wal handling differ by OS. Every other backup test runs
  # under -race in the backup-race shards; scripts/backup-shards.sh checks that each test runs exactly
  # once, that BACKUP_FILE_TESTS matches BACKUP_FILE_COUNT tests, and that the package holds at
  # least BACKUP_TEST_FLOOR.
  BACKUP_FILE_TESTS: ^(TestRestoreFailureAndCrashBringBackDatabaseAndJournal|TestRestoreFailureAndCrash|TestADatabaseHoldingALotAllocatesLittle|TestADatabaseAtItsLimits|TestAFileThatUnpacksToALotAllocatesLittle|TestAFileLargerThanItsManifestSaysIsRefused|TestASettingsFileAtItsLimit|TestAFormerListAtItsLimit|TestAnHonestBackupAllocatesLittle|TestBackingUpAFileOverItsLimitSaysSo)$
  BACKUP_FILE_COUNT: 10
  BACKUP_TEST_FLOOR: 237

# A new push to a pull request cancels that pull request's older run. Any other event gets a
# group of its own, so a push to main, a tag, a schedule or a dispatch is never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.scope.outputs.go }}
    steps:
      - name: Does anything the Go tests read change?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename')"
          else
            echo go=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The Go tree and what it reads, this workflow and its setup action, and what bun-scripts
          # tests: the release and notice scripts, the Kokoro runtime and the Bun manifest.
          if printf '%s\n' "$files" | grep -qE '^(go/|scripts/|runtimes/|package\.json$|bun\.lock$|tsconfig\.json$|\.github/workflows/go\.yml$|\.github/actions/go-setup/)'; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo go=false >> "$GITHUB_OUTPUT"
          fi

  # Linux runs on every pull request that isn't a draft. Its jobs run side by side.

  unit:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        id: setup
        uses: ./.github/actions/go-setup
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build, vet and test with the test-key tag
        # DESIGN §33.5: upgrade's test key exists only under localbase_testkey, so both sides of the
        # tag build and vet, and upgrade's tagged test runs (testkey_on_test.go). The tag goes to
        # these commands only, never job-wide.
        run: |
          go build -tags localbase_testkey ./...
          go vet -tags localbase_testkey ./...
          go test -tags localbase_testkey ./internal/upgrade
      - name: Unit tests
        # Every package with tests runs here, so a new one is covered by default. Left out, and run
        # in their own jobs or workflows: internal/backup (backup-race, backup-files), contract and
        # system (contract), test/chaos (chaos.yml, and one test in small), tools/soak and test/lab
        # (small, without -race).
        run: |
          # shellcheck disable=SC2046 # one argument per package
          go test -race -timeout 30m $(go list ./... | grep -v -e '/go/internal/backup$' -e '/go/test/contract$' -e '/go/test/system$' -e '/go/test/chaos$' -e '/go/tools/soak$' -e '/go/test/lab$')
      - name: Build everything the other jobs build, for the cache
        # Compiles and links every test binary, with and without -race, and runs none of them.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          go build ./...
          go test -count=1 -exec /usr/bin/true ./... > /dev/null
          go test -race -count=1 -exec /usr/bin/true ./... > /dev/null
      - name: Save the build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.paths }}
          key: ${{ steps.setup.outputs.key }}

  backup-race:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: Backup's tests under -race, shard ${{ matrix.shard }} of 3
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pattern=$(scripts/backup-shards.sh "$SHARD" 3)
          go test -race -timeout 25m -count=1 -run "$pattern" ./internal/backup

  backup-files:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: Backup's large-file tests, without -race
        run: |
          n=$(go test -list "$BACKUP_FILE_TESTS" ./internal/backup | grep -c '^Test')
          if [ "$n" -ne "$BACKUP_FILE_COUNT" ]; then echo "expected $BACKUP_FILE_COUNT tests matching BACKUP_FILE_TESTS in internal/backup, found $n"; exit 1; fi
          go test -timeout 15m -count=1 -run "$BACKUP_FILE_TESTS" ./internal/backup

  contract:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: Contract and system suites against the Go gateway
        # scripts/contract.sh keeps a failing run's full go test -json stream.
        env:
          LOCALBASE_CONTRACT_LOGS: ${{ runner.temp }}/contract-runs
        run: scripts/contract.sh
      - name: Keep the failing contract run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-run-linux
          path: ${{ runner.temp }}/contract-runs
          if-no-files-found: ignore

  small:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: Reliability tool tests
        run: go test ./tools/soak ./test/lab
      - name: A killed gateway leaves no backend behind
        run: go test ./test/chaos -run '^TestGatewayKilledOutright$' -count=1

  jstest:
    # The page scripts' unit tests (go/tools/jstest), which no Go job ran: a module-load error in
    # one passed every PR. Bun at the pin and version the runtime release workflows use.
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install the page tests' packages
        run: bun install --frozen-lockfile
      - name: Page script unit tests
        run: bun test go/tools/jstest

  bun-scripts:
    # The Bun scripts' tests and typecheck, which ci.yml ran until it went with the TypeScript
    # release: the runtime release scripts (scripts/runtimes), the Bun notice helpers and the Kokoro
    # runtime's packaging. The release workflows run them too, but only when a release is cut.
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Script tests
        run: bun test scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Format
        run: bunx prettier --check scripts

  # macOS costs the most: it runs after merge, or on a pull request labelled "macos". It has fewer
  # jobs than Linux, since only five macOS jobs run at once.

  macos-unit:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'macos')))
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        id: setup
        uses: ./.github/actions/go-setup
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        # The same packages as Linux's unit job.
        run: |
          # shellcheck disable=SC2046 # one argument per package
          go test -race -timeout 30m $(go list ./... | grep -v -e '/go/internal/backup$' -e '/go/test/contract$' -e '/go/test/system$' -e '/go/test/chaos$' -e '/go/tools/soak$' -e '/go/test/lab$')
      - name: Build everything the other jobs build, for the cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          go build ./...
          go test -count=1 -exec /usr/bin/true ./... > /dev/null
          go test -race -count=1 -exec /usr/bin/true ./... > /dev/null
      - name: Save the build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.paths }}
          key: ${{ steps.setup.outputs.key }}

  macos-backup-race:
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'macos')))
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: Backup's tests under -race, shard ${{ matrix.shard }} of 2
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pattern=$(scripts/backup-shards.sh "$SHARD" 2)
          go test -race -timeout 25m -count=1 -run "$pattern" ./internal/backup

  macos-contract:
    # The contract suite, plus what Linux runs in backup-files and small, plus the CSS check.
    needs: scope
    if: needs.scope.outputs.go == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'macos')))
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: Backup's large-file tests, without -race
        run: |
          n=$(go test -list "$BACKUP_FILE_TESTS" ./internal/backup | grep -c '^Test')
          if [ "$n" -ne "$BACKUP_FILE_COUNT" ]; then echo "expected $BACKUP_FILE_COUNT tests matching BACKUP_FILE_TESTS in internal/backup, found $n"; exit 1; fi
          go test -timeout 15m -count=1 -run "$BACKUP_FILE_TESTS" ./internal/backup
      - name: Reliability tool tests
        run: go test ./tools/soak ./test/lab
      - name: A killed gateway leaves no backend behind
        run: go test ./test/chaos -run '^TestGatewayKilledOutright$' -count=1
      - name: Compiled CSS is current
        run: scripts/tailwind.sh --check
      - name: Contract and system suites against the Go gateway
        env:
          LOCALBASE_CONTRACT_LOGS: ${{ runner.temp }}/contract-runs
        run: scripts/contract.sh
      - name: Keep the failing contract run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-run
          path: ${{ runner.temp }}/contract-runs
          if-no-files-found: ignore

  go-checks:
    # The one check to require: it passes only when every job above that should have run passed.
    needs: [scope, unit, backup-race, backup-files, contract, small, jstest, bun-scripts, macos-unit, macos-backup-race, macos-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every job that should run pass?
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'macos') }}
        run: |
          set -euo pipefail
          result() { jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS"; }
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(result scope)" = success ] || { echo "scope did not succeed"; exit 1; }
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "failed or cancelled: $bad"; exit 1; }
          go=$(jq -r '.scope.outputs.go' <<<"$NEEDS")
          if [ "$go" != true ]; then echo "nothing of the Go tree changed"; exit 0; fi
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then echo "draft: the tests run once it is ready"; exit 0; fi
          must="unit backup-race backup-files contract small jstest bun-scripts"
          if [ "$EVENT" != pull_request ] || [ "$MACOS_LABEL" = true ]; then must="$must macos-unit macos-backup-race macos-contract"; fi
          for j in $must; do
            [ "$(result "$j")" = success ] || { echo "$j should have run and passed, but is $(result "$j")"; exit 1; }
          done
          echo "every job that should run passed"
