name: Go rewrite

on:
  pull_request:
    paths: ["go/**", "drizzle/**", "src/catalog/models/**", "src/manager/managed-runtime-manifest.json", ".github/workflows/go.yml"]
  push:
    branches: [main, rewrite/go]
    paths: ["go/**", "drizzle/**", "src/catalog/models/**", "src/manager/managed-runtime-manifest.json", ".github/workflows/go.yml"]

permissions:
  contents: read

# A runner has no other work on it, so tests get a wide block to pick from.
env:
  LOCALBASE_TEST_PORTS: 24000-29999

# A new push to a pull request cancels that pull request's older run. Any other event gets a
# group of its own, so a push to main, a tag, a schedule or a dispatch is never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        # Every package with tests runs here, so a new one is covered by default. The four left out
        # run in their own steps or workflows: contract (tools/contract.sh, below), tools/chaos
        # (chaos.yml), tools/soak and tools/lab (the next step, without -race). Five of
        # internal/backup's tests run in the step after this one, without -race.
        env:
          BACKUP_FILE_TESTS: ^(TestRestoreFailureAndCrashBringBackDatabaseAndJournal|TestRestoreFailureAndCrash|TestADatabaseHoldingALotAllocatesLittle|TestADatabaseAtItsLimits|TestAFileThatUnpacksToALotAllocatesLittle)$
        run: |
          go test -race -timeout 30m -skip "$BACKUP_FILE_TESTS" $(go list ./... | grep -v -e '/go/contract$' -e '/go/tools/chaos$' -e '/go/tools/soak$' -e '/go/tools/lab$')
      - name: Backup's crash and large-file tests, without -race
        # They copy, sync and measure large files, and -race makes them 6-21 times slower while
        # adding little to what they test: about 45% of internal/backup's time under -race. They
        # run on macOS too, since SQLite's locking and -wal handling differ by OS. The count check
        # keeps a renamed test from being skipped above and run nowhere.
        env:
          BACKUP_FILE_TESTS: ^(TestRestoreFailureAndCrashBringBackDatabaseAndJournal|TestRestoreFailureAndCrash|TestADatabaseHoldingALotAllocatesLittle|TestADatabaseAtItsLimits|TestAFileThatUnpacksToALotAllocatesLittle)$
        run: |
          n=$(go test -list "$BACKUP_FILE_TESTS" ./internal/backup | grep -c '^Test')
          if [ "$n" -ne 5 ]; then echo "expected 5 tests matching BACKUP_FILE_TESTS in internal/backup, found $n"; exit 1; fi
          go test -timeout 30m -count=1 -run "$BACKUP_FILE_TESTS" ./internal/backup
      - name: Reliability tool tests
        run: go test ./tools/soak ./tools/lab
      - name: A killed gateway leaves no backend behind
        run: go test ./tools/chaos -run '^TestGatewayKilledOutright$' -count=1
      - name: Compiled CSS is current
        run: tools/tailwind.sh --check
      - name: Contract suite against the Go gateway
        # tools/contract.sh keeps a failing run's full go test -json stream.
        env:
          LOCALBASE_CONTRACT_LOGS: ${{ runner.temp }}/contract-runs
        run: tools/contract.sh -args -impl=go
      - name: Keep the failing contract run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-run
          path: ${{ runner.temp }}/contract-runs
          if-no-files-found: ignore

  test-linux:
    # Linux qualification (M6 step 3): the same checks on Ubuntu.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        # Every package with tests runs here, so a new one is covered by default. The four left out
        # run in their own steps or workflows: contract (tools/contract.sh, below), tools/chaos
        # (chaos.yml), tools/soak and tools/lab (the next step, without -race). Five of
        # internal/backup's tests run in the step after this one, without -race.
        env:
          BACKUP_FILE_TESTS: ^(TestRestoreFailureAndCrashBringBackDatabaseAndJournal|TestRestoreFailureAndCrash|TestADatabaseHoldingALotAllocatesLittle|TestADatabaseAtItsLimits|TestAFileThatUnpacksToALotAllocatesLittle)$
        run: |
          go test -race -timeout 30m -skip "$BACKUP_FILE_TESTS" $(go list ./... | grep -v -e '/go/contract$' -e '/go/tools/chaos$' -e '/go/tools/soak$' -e '/go/tools/lab$')
      - name: Backup's crash and large-file tests, without -race
        # They copy, sync and measure large files, and -race makes them 6-21 times slower while
        # adding little to what they test: about 45% of internal/backup's time under -race. They
        # run on macOS too, since SQLite's locking and -wal handling differ by OS. The count check
        # keeps a renamed test from being skipped above and run nowhere.
        env:
          BACKUP_FILE_TESTS: ^(TestRestoreFailureAndCrashBringBackDatabaseAndJournal|TestRestoreFailureAndCrash|TestADatabaseHoldingALotAllocatesLittle|TestADatabaseAtItsLimits|TestAFileThatUnpacksToALotAllocatesLittle)$
        run: |
          n=$(go test -list "$BACKUP_FILE_TESTS" ./internal/backup | grep -c '^Test')
          if [ "$n" -ne 5 ]; then echo "expected 5 tests matching BACKUP_FILE_TESTS in internal/backup, found $n"; exit 1; fi
          go test -timeout 30m -count=1 -run "$BACKUP_FILE_TESTS" ./internal/backup
      - name: Reliability tool tests
        run: go test ./tools/soak ./tools/lab
      - name: A killed gateway leaves no backend behind
        run: go test ./tools/chaos -run '^TestGatewayKilledOutright$' -count=1
      - name: Contract suite against the Go gateway
        env:
          LOCALBASE_CONTRACT_LOGS: ${{ runner.temp }}/contract-runs
        run: tools/contract.sh -args -impl=go
      - name: Keep the failing contract run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-run-linux
          path: ${{ runner.temp }}/contract-runs
          if-no-files-found: ignore
