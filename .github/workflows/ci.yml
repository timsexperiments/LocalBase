name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gateway integration tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: CLI smoke test
        run: bun run check

  runtime-smoke-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux x64 CLI
        run: |
          bun run scripts/release-artifacts.ts build \
            --target linux-x64 \
            --output extracted/linux-x64
          chmod +x extracted/linux-x64/local-base-linux-x64

      - name: Run exact CLI runtime smoke
        env:
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runtime-smoke-linux-x64
          LOCALBASE_SMOKE_TARGET: linux-x64
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/extracted/linux-x64/local-base-linux-x64
        run: |
          mkdir -p "$RUNNER_TEMP"
          bun test --timeout 120000 scripts/runtime-smoke.test.ts
