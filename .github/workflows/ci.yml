name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Any other event gets a
# group of its own, so a push to main, a tag, a schedule or a dispatch is never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # "validate" is a required check, so this workflow runs on every pull request and its jobs skip
  # instead (a skipped job satisfies a required check; a workflow that never starts does not). The
  # legacy TS suite runs only when something outside go/ changed, and never on a draft.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.scope.outputs.ts }}
    steps:
      - name: Does anything outside go/ change?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ]; then echo ts=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = pull_request ]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename')"
          else
            echo ts=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qv '^go/'; then echo ts=true >> "$GITHUB_OUTPUT"; else echo ts=false >> "$GITHUB_OUTPUT"; fi

  validate-macos:
    needs: scope
    if: needs.scope.outputs.ts == 'true'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Gateway integration tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: CLI smoke test
        run: bun run check

  validate:
    needs: scope
    if: needs.scope.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gateway integration tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: CLI smoke test
        run: bun run check

  runtime-smoke-linux:
    needs: scope
    if: needs.scope.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux x64 CLI
        run: |
          bun run scripts/release-artifacts.ts build \
            --target linux-x64 \
            --output extracted/linux-x64
          chmod +x extracted/linux-x64/local-base-linux-x64

      - name: Run CLI runtime smoke test
        env:
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runtime-smoke-linux-x64
          LOCALBASE_SMOKE_TARGET: linux-x64
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/extracted/linux-x64/local-base-linux-x64
        run: |
          mkdir -p "$RUNNER_TEMP"
          bun test --timeout 120000 scripts/runtime-smoke.test.ts
