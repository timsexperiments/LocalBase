name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gateway integration tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: CLI smoke test
        run: bun run check

  runtime-smoke-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux smoke-test artifacts
        run: bun run smoke:runtime:build-linux

      - name: Run native Ubuntu runtime smoke test
        env:
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/dist/runtime-smoke/local-base-linux-x64
        run: ./dist/runtime-smoke/runtime-smoke-linux-x64

      - name: Run minimal Linux container runtime smoke test
        run: |
          docker build --platform linux/amd64 --file Dockerfile.runtime-smoke --tag localbase-runtime-smoke:ci .
          docker run --rm localbase-runtime-smoke:ci
