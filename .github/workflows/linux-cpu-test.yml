name: Linux CPU check (throwaway)
on:
  pull_request:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Chat and Kokoro with the fixes, each attempt on a fresh gateway
        run: |
          (cd go && CGO_ENABLED=0 go build -buildvcs=false -o "$RUNNER_TEMP/lb" ./cmd/localbase)
          export LOCALBASE_ROOT="$RUNNER_TEMP/root"
          LB="$RUNNER_TEMP/lb"
          lb(){ "$LB" --non-interactive "$@"; }
          lb init > /dev/null
          key="$(lb keys create --name t --scopes inference:chat,inference:speech,models:read,models:manage 2>/dev/null | sed -nE 's/^secret=//p')"
          lb models install qwen3.5-4b-q4_k_m 2>&1 | tail -1 | cut -c1-90
          # The binary itself goes in the background, so $g is its pid and stopping it really stops it.
          start(){ "$LB" --non-interactive serve --host 127.0.0.1 --port 26800 --llm-port 26801 > "$RUNNER_TEMP/serve.log" 2>&1 & g=$!; for i in $(seq 1 60); do curl -fsS -m1 -o /dev/null http://127.0.0.1:26800/health 2>/dev/null && break; sleep 1; done; echo "gateway pid $g, running: $(kill -0 $g 2>/dev/null && echo yes || echo no)"; }
          stopit(){ kill "$g" 2>/dev/null || true; wait "$g" 2>/dev/null || true; for i in $(seq 1 30); do curl -fsS -m1 -o /dev/null http://127.0.0.1:26800/health 2>/dev/null || break; sleep 1; done; if curl -fsS -m1 -o /dev/null http://127.0.0.1:26800/health 2>/dev/null; then echo "STILL UP"; else echo "gateway stopped"; fi; }
          chat(){ curl -s -m 600 -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/o" -w '%{http_code} %{time_total}s' http://127.0.0.1:26800/v1/chat/completions -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"model":"qwen3.5-4b-q4_k_m","max_tokens":'"${1:-64}"',"messages":[{"role":"user","content":"Say hello."}]}'; echo " retry-after=[$(grep -i '^retry-after' "$RUNNER_TEMP/h" | tr -d '\r' | cut -d' ' -f2)] $(jq -c 'if .error then {code:.error.code,msg:.error.message} else {finish:.choices[0].finish_reason,content_len:(.choices[0].message.content|length),reasoning_len:(.choices[0].message.reasoning|length)} end' "$RUNNER_TEMP/o" 2>/dev/null | cut -c1-330)"; }
          diag(){ grep -a -E '^\{' "$RUNNER_TEMP/serve.log" | jq -c 'select(.severity=="warn" or .severity=="error") | select(.eventName!="http.request") | {e:.eventName,a:(.attributes|del(.auth_outcome,.auth_principal_id,.auth_principal_name,.auth_source))|with_entries(select(.key|test("request|avail|reserve|reason|confidence|mode|layers")))}' 2>/dev/null | cut -c1-360 | head -3 || true; }
          show(){ lb models show qwen3.5-4b-q4_k_m 2>&1 | grep -iE 'This machine|Next load|layers' | cut -c1-110 || true; }
          lower(){ lb config show > "$RUNNER_TEMP/c.toml"; sed -i -E '/^\[memory\.systemReserve\]/,/^\[/ { s/^percent = .*/percent = 5/; s/^minimumGb = .*/minimumGb = 1/ }' "$RUNNER_TEMP/c.toml"; lb config apply --file "$RUNNER_TEMP/c.toml" --restart never 2>&1 | grep -E 'systemReserve' | cut -c1-70 || true; }
          echo "=== A. default reserve"; show; free -m | sed -n 2p; start; chat; diag; stopit
          echo "=== backends for the model"; lb models backend qwen3.5-4b-q4_k_m 2>&1 | sed -n 1,3p | cut -c1-110 || true
          echo "=== lower reserve"; lower; show
          echo "=== B. reserve 5%/1 GiB, automatic"; start; chat; chat 200; diag; stopit
          echo "=== C. --mode cpu"; lb models placement qwen3.5-4b-q4_k_m --mode cpu 2>&1 | sed -n 2,3p | cut -c1-100 || true; start; chat; diag; stopit
          echo "=== D. --mode custom --gpu-layers 0"; lb models placement qwen3.5-4b-q4_k_m --mode custom --gpu-layers 0 2>&1 | sed -n 2,3p | cut -c1-100 || true; start; chat; diag; stopit
          lb models placement qwen3.5-4b-q4_k_m --reset > /dev/null 2>&1 || true
          echo "=== E. Kokoro"; lb config show > "$RUNNER_TEMP/c.toml"; sed -i -E '/^allowExperimental = /d; s/^\[models\]$/[models]\nallowExperimental = true/; s/^selectedTtsModels = .*/selectedTtsModels = ["kokoro-82m-v1.0-q8"]/; s/^activeTtsModel = .*/activeTtsModel = "kokoro-82m-v1.0-q8"/' "$RUNNER_TEMP/c.toml"; lb config apply --file "$RUNNER_TEMP/c.toml" --restart never > /dev/null 2>&1 || true
          lb models install kokoro-82m-v1.0-q8 2>&1 | tail -1 | cut -c1-90
          lb models backend kokoro-82m-v1.0-q8 2>&1 | grep -E 'Backend:|onnx-cpu' | cut -c1-140 || true
          start; curl -s -m 60 -o "$RUNNER_TEMP/o" -w 'speech automatic %{http_code}' http://127.0.0.1:26800/v1/audio/speech -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"model":"kokoro-82m-v1.0-q8","input":"hello there","voice":"af_heart"}'; echo " $(jq -c '.error|{code,message}' "$RUNNER_TEMP/o" 2>/dev/null | cut -c1-170)"
          lb models backend kokoro-82m-v1.0-q8 --set onnx-cpu 2>&1 | sed -n 1,3p | cut -c1-130 || true
          curl -s -m 60 -o "$RUNNER_TEMP/o" -w 'speech onnx-cpu %{http_code}' http://127.0.0.1:26800/v1/audio/speech -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"model":"kokoro-82m-v1.0-q8","input":"hello there","voice":"af_heart"}'; echo " $(jq -c '.error|{code,message}' "$RUNNER_TEMP/o" 2>/dev/null | cut -c1-170)"
          stopit
