name: Chaos

# Breaks a real gateway on purpose, with fake backends: no models, no GPU. See
# go/docs/reliability.md. Tests naming an open bug skip and say so.
on:
  pull_request:
    paths: ["go/**", ".github/workflows/chaos.yml"]
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/chaos.yml"]
  schedule:
    - cron: "53 6 * * *"

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Any other event gets a
# group of its own, so a push to main, a tag, a schedule or a dispatch is never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chaos:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Mount a small disk for the disk-full tests
        # macOS creates its own disk image in the tests.
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=96m tmpfs /mnt/small
          sudo chown "$(id -u):$(id -g)" /mnt/small
          echo "LOCALBASE_CHAOS_SMALL_DISK=/mnt/small" >> "$GITHUB_ENV"
      - name: Chaos suite
        run: go test ./tools/chaos -count=1 -timeout 10m -v

  known-bugs:
    # Skips must name an open PR. This goes red when a named PR merges, until its skip
    # is removed. It runs nightly too, so that can't surprise anyone for long.
    if: github.event_name != 'schedule' || github.repository == 'timsexperiments/LocalBase'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every skip names an open PR
        working-directory: go
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/known-bugs-check.sh
