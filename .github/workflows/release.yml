name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-whisper:
    name: Build release inputs (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            architecture: x86_64
          - runner: macos-14
            target: macos-arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify managed runtime architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Import Apple Certificate
        if: matrix.target == 'macos-arm64'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Build Linux x64 CLI and smoke runner
        if: matrix.target == 'linux-x64'
        run: |
          bun run scripts/release-artifacts.ts build --target linux-x64 --output release-artifacts/linux-x64
          bun run scripts/release-artifacts.ts manifest --target linux-x64 --output release-artifacts/linux-x64

      - name: Build macOS CLI and smoke runners
        if: matrix.target == 'macos-arm64'
        run: |
          bun run scripts/release-artifacts.ts build --target macos-arm64 --output release-artifacts/macos-arm64
          bun run scripts/release-artifacts.ts build --target macos-x64 --output release-artifacts/macos-x64

      - name: Build verified whisper-server
        run: bun run scripts/build-whisper.ts

      - name: Sign macOS CLI binaries
        if: matrix.target == 'macos-arm64'
        run: |
          codesign --force --options runtime --sign "Developer ID Application:" release-artifacts/macos-arm64/local-base-macos-arm64
          codesign --force --options runtime --sign "Developer ID Application:" release-artifacts/macos-x64/local-base-macos-x64
          codesign --force --options runtime --sign "Developer ID Application:" build-whisper/whisper-server

      - name: Notarize macOS binaries
        if: matrix.target == 'macos-arm64'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j local-base-macos-arm64.zip release-artifacts/macos-arm64/local-base-macos-arm64
          zip -j local-base-macos-x64.zip release-artifacts/macos-x64/local-base-macos-x64
          zip -j whisper-server-macos-arm64.zip build-whisper/whisper-server
          xcrun notarytool submit local-base-macos-arm64.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun notarytool submit local-base-macos-x64.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun notarytool submit whisper-server-macos-arm64.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait

      - name: Generate macOS artifact manifests
        if: matrix.target == 'macos-arm64'
        run: |
          bun run scripts/release-artifacts.ts manifest --target macos-arm64 --output release-artifacts/macos-arm64
          bun run scripts/release-artifacts.ts manifest --target macos-x64 --output release-artifacts/macos-x64

      - name: Generate Linux x64 artifact manifest
        if: matrix.target == 'linux-x64'
        run: bun run scripts/release-artifacts.ts verify --target linux-x64 --output release-artifacts/linux-x64

      - name: Clean up temporary keychain
        if: always() && matrix.target == 'macos-arm64'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload Linux x64 qualification input
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-input-linux-x64
          path: release-artifacts/linux-x64

      - name: Upload macOS ARM64 qualification input
        if: matrix.target == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: release-input-macos-arm64
          path: release-artifacts/macos-arm64

      - name: Upload macOS x64 qualification input
        if: matrix.target == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: release-input-macos-x64
          path: release-artifacts/macos-x64

      - name: Upload whisper-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-runtime-${{ matrix.target }}
          path: build-whisper/whisper-server

  build-linux-arm64:
    name: Build release inputs (linux-arm64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and manifest Linux ARM64 CLI and smoke runner
        run: |
          bun run scripts/release-artifacts.ts build --target linux-arm64 --output release-artifacts/linux-arm64
          bun run scripts/release-artifacts.ts manifest --target linux-arm64 --output release-artifacts/linux-arm64
          bun run scripts/release-artifacts.ts verify --target linux-arm64 --output release-artifacts/linux-arm64

      - name: Upload Linux ARM64 qualification input
        uses: actions/upload-artifact@v4
        with:
          name: release-input-linux-arm64
          path: release-artifacts/linux-arm64

  qualify-linux-x64:
    name: Qualify exact Linux x64 CLI (native)
    needs: build-whisper
    if: needs.build-whisper.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-input-linux-x64
          path: qualified/linux-x64

      - name: Verify downloaded Linux x64 manifest
        run: bun run scripts/release-artifacts.ts verify --target linux-x64 --output qualified/linux-x64

      - name: Make exact Linux x64 artifacts executable
        run: chmod +x qualified/linux-x64/local-base-linux-x64 qualified/linux-x64/localbase-runtime-smoke-linux-x64

      - name: Execute exact Linux x64 smoke runner (native)
        env:
          HOME: ${{ runner.temp }}/localbase-home-linux-x64
          TMPDIR: ${{ runner.temp }}/localbase-tmp-linux-x64
          XDG_CONFIG_HOME: ${{ runner.temp }}/localbase-config-linux-x64
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runner-linux-x64
          LOCALBASE_SMOKE_TARGET: linux-x64
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/qualified/linux-x64/local-base-linux-x64
        run: |
          mkdir -p "$HOME" "$TMPDIR" "$XDG_CONFIG_HOME" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/qualified/linux-x64/localbase-runtime-smoke-linux-x64"

      - name: Qualify tested Linux x64 artifacts
        run: bun run scripts/release-artifacts.ts qualify --target linux-x64 --output qualified/linux-x64

      - name: Upload qualified Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualified-linux-x64
          path: qualified/linux-x64

  qualify-macos:
    name: Qualify exact macOS CLIs (ARM64 native and x64 Rosetta)
    needs: build-whisper
    if: needs.build-whisper.result == 'success'
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-input-macos-arm64
          path: qualified/macos-arm64

      - name: Download exact macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-input-macos-x64
          path: qualified/macos-x64

      - name: Verify downloaded macOS manifests
        run: |
          bun run scripts/release-artifacts.ts verify --target macos-arm64 --output qualified/macos-arm64
          bun run scripts/release-artifacts.ts verify --target macos-x64 --output qualified/macos-x64

      - name: Make exact macOS artifacts executable
        run: |
          chmod +x qualified/macos-arm64/local-base-macos-arm64 qualified/macos-arm64/localbase-runtime-smoke-macos-arm64
          chmod +x qualified/macos-x64/local-base-macos-x64 qualified/macos-x64/localbase-runtime-smoke-macos-x64

      - name: Execute exact macOS ARM64 smoke runner (native)
        env:
          HOME: ${{ runner.temp }}/localbase-home-macos-arm64
          TMPDIR: ${{ runner.temp }}/localbase-tmp-macos-arm64
          XDG_CONFIG_HOME: ${{ runner.temp }}/localbase-config-macos-arm64
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runner-macos-arm64
          LOCALBASE_SMOKE_TARGET: macos-arm64
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/qualified/macos-arm64/local-base-macos-arm64
        run: |
          mkdir -p "$HOME" "$TMPDIR" "$XDG_CONFIG_HOME" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/qualified/macos-arm64/localbase-runtime-smoke-macos-arm64"

      - name: Execute exact macOS x64 smoke runner under Rosetta (translated)
        env:
          HOME: ${{ runner.temp }}/localbase-home-macos-x64
          TMPDIR: ${{ runner.temp }}/localbase-tmp-macos-x64
          XDG_CONFIG_HOME: ${{ runner.temp }}/localbase-config-macos-x64
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runner-macos-x64
          LOCALBASE_SMOKE_TARGET: macos-x64
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/qualified/macos-x64/local-base-macos-x64
        run: |
          mkdir -p "$HOME" "$TMPDIR" "$XDG_CONFIG_HOME" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          /usr/bin/arch -x86_64 "$GITHUB_WORKSPACE/qualified/macos-x64/localbase-runtime-smoke-macos-x64"

      - name: Qualify tested macOS artifacts
        run: |
          bun run scripts/release-artifacts.ts qualify --target macos-arm64 --output qualified/macos-arm64
          bun run scripts/release-artifacts.ts qualify --target macos-x64 --output qualified/macos-x64

      - name: Upload qualified macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualified-macos-arm64
          path: qualified/macos-arm64

      - name: Upload qualified macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualified-macos-x64
          path: qualified/macos-x64

  qualify-linux-arm64:
    name: Qualify exact Linux ARM64 CLI through Docker/QEMU (emulated)
    needs: build-linux-arm64
    if: needs.build-linux-arm64.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-input-linux-arm64
          path: qualified/linux-arm64

      - name: Verify downloaded Linux ARM64 manifest
        run: bun run scripts/release-artifacts.ts verify --target linux-arm64 --output qualified/linux-arm64

      - name: Make exact Linux ARM64 artifacts executable
        run: chmod +x qualified/linux-arm64/local-base-linux-arm64 qualified/linux-arm64/localbase-runtime-smoke-linux-arm64

      - name: Build Linux ARM64 qualification image (Docker/QEMU)
        run: |
          docker build --platform linux/arm64 \
            --build-arg ARTIFACT_DIR=qualified/linux-arm64 \
            --build-arg ARTIFACT_TARGET=linux-arm64 \
            --build-arg SMOKE_RUNNER_FILENAME=localbase-runtime-smoke-linux-arm64 \
            --file Dockerfile.runtime-smoke \
            --tag localbase-runtime-smoke:linux-arm64 .

      - name: Execute exact Linux ARM64 smoke runner through Docker/QEMU
        run: docker run --rm --platform linux/arm64 localbase-runtime-smoke:linux-arm64

      - name: Qualify tested Linux ARM64 artifacts
        run: bun run scripts/release-artifacts.ts qualify --target linux-arm64 --output qualified/linux-arm64

      - name: Upload qualified Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualified-linux-arm64
          path: qualified/linux-arm64

  release:
    name: Package and Release Qualified Artifacts
    needs:
      - build-whisper
      - qualify-linux-x64
      - qualify-macos
      - qualify-linux-arm64
    if: >-
      always() &&
      needs.build-whisper.result == 'success' &&
      needs.qualify-linux-x64.result == 'success' &&
      needs.qualify-macos.result == 'success' &&
      needs.qualify-linux-arm64.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation checks
        run: |
          bun run typecheck
          bun run check

      - name: Download qualified Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-linux-x64
          path: qualified/linux-x64

      - name: Download qualified Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-linux-arm64
          path: qualified/linux-arm64

      - name: Download qualified macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-macos-arm64
          path: qualified/macos-arm64

      - name: Download qualified macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-macos-x64
          path: qualified/macos-x64

      - name: Download whisper-server (Linux x64)
        uses: actions/download-artifact@v4
        with:
          name: whisper-runtime-linux-x64
          path: release-linux-x64

      - name: Download whisper-server (macOS ARM64)
        uses: actions/download-artifact@v4
        with:
          name: whisper-runtime-macos-arm64
          path: release-macos-arm64

      - name: Stage qualified CLI artifacts
        run: |
          bun run scripts/release-artifacts.ts stage \
            --input qualified/linux-x64 \
            --input qualified/linux-arm64 \
            --input qualified/macos-arm64 \
            --input qualified/macos-x64 \
            --output release

      - name: Append managed runtime checksums to final manifest
        run: |
          cp release-linux-x64/whisper-server release/whisper-server-linux-x64
          cp release-macos-arm64/whisper-server release/whisper-server-macos-arm64
          (
            cd release
            sha256sum whisper-server-* >> checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/local-base-macos-arm64
            release/local-base-macos-x64
            release/local-base-linux-x64
            release/local-base-linux-arm64
            release/whisper-server-macos-arm64
            release/whisper-server-linux-x64
            release/checksums.txt
          generate_release_notes: true
