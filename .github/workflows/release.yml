name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation checks
        run: |
          bun run typecheck
          bun run check

      - name: Validate release tag and version
        run: bun run scripts/release-preflight.ts "$GITHUB_REF_NAME"

  qualify:
    name: Build and qualify ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            host-architecture: arm64
            platform: macos
            smoke: native
          - target: macos-x64
            runner: macos-14
            host-architecture: arm64
            platform: macos
            managed: false
            smoke: rosetta
          - target: linux-x64
            runner: ubuntu-24.04
            host-architecture: x86_64
            platform: linux
            smoke: native
          - target: linux-arm64
            runner: ubuntu-24.04
            host-architecture: x86_64
            platform: linux
            managed: false
            smoke: qemu
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.host-architecture }}"

      - name: Import Apple Certificate
        if: matrix.platform == 'macos'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Build CLI
        run: |
          bun run scripts/release-artifacts.ts build \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}

      - name: Package Linux CLI
        if: matrix.platform == 'linux'
        run: |
          tar -czf release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}.tar.gz \
            -C release-artifacts/${{ matrix.target }} \
            local-base-${{ matrix.target }}

      - name: Sign macOS CLI
        if: matrix.platform == 'macos'
        run: |
          codesign --force --options runtime --timestamp --sign "Developer ID Application:" \
            release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}

      - name: Notarize macOS CLI
        if: matrix.platform == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}.zip \
            release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}
          xcrun notarytool submit release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Write and verify artifact manifest
        run: |
          bun run scripts/release-artifacts.ts manifest \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}
          bun run scripts/release-artifacts.ts verify \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}

      - name: Extract canonical CLI package
        run: |
          mkdir -p extracted/${{ matrix.target }}
          if [ "${{ matrix.platform }}" = "macos" ]; then
            unzip -q release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}.zip \
              -d extracted/${{ matrix.target }}
          else
            tar -xzf release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}.tar.gz \
              -C extracted/${{ matrix.target }}
          fi

      - name: Verify extracted CLI package
        run: |
          bun run scripts/release-artifacts.ts verify-package \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }} \
            --extracted extracted/${{ matrix.target }}

      - name: Verify Linux x64 architecture and dependencies
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          cli=extracted/linux-x64/local-base-linux-x64
          machine="$(readelf -h "$cli" | awk -F: '$1 ~ /^[[:space:]]*Machine$/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}')"
          test "$machine" = "Advanced Micro Devices X86-64"
          ldd_output="$(ldd "$cli" 2>&1 || true)"
          printf '%s\n' "$ldd_output"
          if grep -q "not found" <<<"$ldd_output"; then
            exit 1
          fi

      - name: Verify packaged macOS CLI architecture and trust
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          cli=extracted/${{ matrix.target }}/local-base-${{ matrix.target }}
          expected_architecture=arm64
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            expected_architecture=x86_64
          fi
          test "$(lipo -archs "$cli")" = "$expected_architecture"
          codesign --verify --strict --verbose=2 "$cli"
          spctl --assess --type execute "$cli"

      - name: Make CLI executable
        run: chmod +x extracted/${{ matrix.target }}/local-base-${{ matrix.target }}

      - name: Verify Rosetta translation
        if: matrix.smoke == 'rosetta'
        run: /usr/bin/arch -x86_64 /usr/bin/true

      - name: Run CLI runtime smoke test
        if: matrix.smoke != 'qemu'
        env:
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runtime-smoke-${{ matrix.target }}
          LOCALBASE_SMOKE_TARGET: ${{ matrix.target }}
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/extracted/${{ matrix.target }}/local-base-${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          bun test --timeout 120000 scripts/runtime-smoke.test.ts

      - name: Build Linux ARM64 runtime smoke image (Docker/QEMU)
        if: matrix.smoke == 'qemu'
        run: |
          docker build --platform linux/arm64 \
            --build-arg ARTIFACT_DIR=extracted/linux-arm64 \
            --build-arg ARTIFACT_TARGET=linux-arm64 \
            --file Dockerfile.runtime-smoke \
            --tag localbase-runtime-smoke:linux-arm64 .

      - name: Verify Linux ARM64 architecture and dependencies
        if: matrix.target == 'linux-arm64'
        run: |
          set -euo pipefail
          readelf -h extracted/linux-arm64/local-base-linux-arm64 | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64$'
          docker run --rm --platform linux/arm64 \
            --entrypoint /bin/sh localbase-runtime-smoke:linux-arm64 \
            -c 'set -eu; ldd_output="$(ldd /opt/localbase/local-base 2>&1 || true)"; printf "%s\\n" "$ldd_output"; ! printf "%s\\n" "$ldd_output" | grep -q "not found"'

      - name: Run CLI runtime smoke test
        if: matrix.smoke == 'qemu'
        run: docker run --rm --platform linux/arm64 localbase-runtime-smoke:linux-arm64

      - name: Record artifact qualification
        run: |
          bun run scripts/release-artifacts.ts qualify \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }} \
            --extracted extracted/${{ matrix.target }}

      - name: Upload qualified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}

      - name: Clean up temporary keychain
        if: always() && matrix.platform == 'macos'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  release:
    name: Package and Release Qualified Artifacts
    needs: qualify
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download qualified Linux x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-linux-x64
          path: qualified/linux-x64

      - name: Download qualified Linux ARM64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-linux-arm64
          path: qualified/linux-arm64

      - name: Download qualified macOS ARM64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-macos-arm64
          path: qualified/macos-arm64

      - name: Download qualified macOS x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-macos-x64
          path: qualified/macos-x64

      - name: Stage qualified CLI artifacts
        run: |
          bun run scripts/release-artifacts.ts stage \
            --input qualified/linux-x64 \
            --input qualified/linux-arm64 \
            --input qualified/macos-arm64 \
            --input qualified/macos-x64 \
            --output release

      - name: Attest canonical release packages and checksums
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/local-base-macos-arm64.zip
            release/local-base-macos-x64.zip
            release/local-base-linux-x64.tar.gz
            release/local-base-linux-arm64.tar.gz
            release/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/local-base-macos-arm64.zip
            release/local-base-macos-x64.zip
            release/local-base-linux-x64.tar.gz
            release/local-base-linux-arm64.tar.gz
            release/checksums.txt
          generate_release_notes: true
