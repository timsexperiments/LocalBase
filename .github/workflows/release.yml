name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation checks
        run: |
          bun run typecheck
          bun run check

  qualify:
    name: Build and qualify ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            host-architecture: arm64
            platform: macos
            managed: true
            smoke: native
          - target: macos-x64
            runner: macos-14
            host-architecture: arm64
            platform: macos
            managed: false
            smoke: rosetta
          - target: linux-x64
            runner: ubuntu-24.04
            host-architecture: x86_64
            platform: linux
            managed: true
            smoke: native
          - target: linux-arm64
            runner: ubuntu-24.04
            host-architecture: x86_64
            platform: linux
            managed: false
            smoke: qemu
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.host-architecture }}"

      - name: Import Apple Certificate
        if: matrix.platform == 'macos'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Build CLI and smoke runner
        run: |
          bun run scripts/release-artifacts.ts build \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}

      - name: Build verified whisper-server
        if: matrix.managed
        run: |
          bun run scripts/build-whisper.ts
          cp build-whisper/whisper-server \
            release-artifacts/${{ matrix.target }}/whisper-server

      - name: Sign macOS CLI
        if: matrix.platform == 'macos'
        run: |
          codesign --force --options runtime --sign "Developer ID Application:" \
            release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}

      - name: Sign managed macOS whisper-server
        if: matrix.target == 'macos-arm64'
        run: |
          codesign --force --options runtime --sign "Developer ID Application:" \
            release-artifacts/macos-arm64/whisper-server

      - name: Notarize macOS CLI
        if: matrix.platform == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j local-base-${{ matrix.target }}.zip \
            release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}
          xcrun notarytool submit local-base-${{ matrix.target }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Notarize managed macOS whisper-server
        if: matrix.target == 'macos-arm64'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j whisper-server-macos-arm64.zip \
            release-artifacts/macos-arm64/whisper-server
          xcrun notarytool submit whisper-server-macos-arm64.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

      - name: Write and verify artifact manifest
        run: |
          bun run scripts/release-artifacts.ts manifest \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}
          bun run scripts/release-artifacts.ts verify \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}

      - name: Make exact artifacts executable
        run: |
          chmod +x \
            release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }} \
            release-artifacts/${{ matrix.target }}/localbase-runtime-smoke-${{ matrix.target }}

      - name: Verify Rosetta translation
        if: matrix.smoke == 'rosetta'
        run: /usr/bin/arch -x86_64 /usr/bin/true

      - name: Execute exact artifact smoke runner (native)
        if: matrix.smoke == 'native'
        env:
          HOME: ${{ runner.temp }}/localbase-home-${{ matrix.target }}
          TMPDIR: ${{ runner.temp }}/localbase-tmp-${{ matrix.target }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/localbase-config-${{ matrix.target }}
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runner-${{ matrix.target }}
          LOCALBASE_SMOKE_TARGET: ${{ matrix.target }}
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/release-artifacts/${{ matrix.target }}/local-base-${{ matrix.target }}
        run: |
          mkdir -p "$HOME" "$TMPDIR" "$XDG_CONFIG_HOME" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/release-artifacts/${{ matrix.target }}/localbase-runtime-smoke-${{ matrix.target }}"

      - name: Execute exact macOS x64 smoke runner under Rosetta
        if: matrix.smoke == 'rosetta'
        env:
          HOME: ${{ runner.temp }}/localbase-home-macos-x64
          TMPDIR: ${{ runner.temp }}/localbase-tmp-macos-x64
          XDG_CONFIG_HOME: ${{ runner.temp }}/localbase-config-macos-x64
          RUNNER_TEMP: ${{ runner.temp }}/localbase-runner-macos-x64
          LOCALBASE_SMOKE_TARGET: macos-x64
          LOCALBASE_SMOKE_CLI: ${{ github.workspace }}/release-artifacts/macos-x64/local-base-macos-x64
        run: |
          mkdir -p "$HOME" "$TMPDIR" "$XDG_CONFIG_HOME" "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          /usr/bin/arch -x86_64 \
            "$GITHUB_WORKSPACE/release-artifacts/macos-x64/localbase-runtime-smoke-macos-x64"

      - name: Build Linux ARM64 qualification image (Docker/QEMU)
        if: matrix.smoke == 'qemu'
        run: |
          docker build --platform linux/arm64 \
            --build-arg ARTIFACT_DIR=release-artifacts/linux-arm64 \
            --build-arg ARTIFACT_TARGET=linux-arm64 \
            --build-arg SMOKE_RUNNER_FILENAME=localbase-runtime-smoke-linux-arm64 \
            --file Dockerfile.runtime-smoke \
            --tag localbase-runtime-smoke:linux-arm64 .

      - name: Execute exact Linux ARM64 smoke runner through Docker/QEMU
        if: matrix.smoke == 'qemu'
        run: docker run --rm --platform linux/arm64 localbase-runtime-smoke:linux-arm64

      - name: Record artifact qualification
        run: |
          bun run scripts/release-artifacts.ts qualify \
            --target ${{ matrix.target }} \
            --output release-artifacts/${{ matrix.target }}

      - name: Upload qualified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qualified-${{ matrix.target }}
          path: release-artifacts/${{ matrix.target }}

      - name: Clean up temporary keychain
        if: always() && matrix.platform == 'macos'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  release:
    name: Package and Release Qualified Artifacts
    needs: qualify
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download qualified Linux x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-linux-x64
          path: qualified/linux-x64

      - name: Download qualified Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-linux-arm64
          path: qualified/linux-arm64

      - name: Download qualified macOS ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-macos-arm64
          path: qualified/macos-arm64

      - name: Download qualified macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: qualified-macos-x64
          path: qualified/macos-x64

      - name: Stage qualified CLI artifacts
        run: |
          bun run scripts/release-artifacts.ts stage \
            --input qualified/linux-x64 \
            --input qualified/linux-arm64 \
            --input qualified/macos-arm64 \
            --input qualified/macos-x64 \
            --output release

      - name: Append managed runtime checksums to final manifest
        run: |
          cp qualified/linux-x64/whisper-server release/whisper-server-linux-x64
          cp qualified/macos-arm64/whisper-server release/whisper-server-macos-arm64
          (
            cd release
            sha256sum whisper-server-* >> checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/local-base-macos-arm64
            release/local-base-macos-x64
            release/local-base-linux-x64
            release/local-base-linux-arm64
            release/whisper-server-macos-arm64
            release/whisper-server-linux-x64
            release/checksums.txt
          generate_release_notes: true
