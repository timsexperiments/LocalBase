name: Release Whisper Runtime

on:
  pull_request:
    paths:
      - .github/workflows/release-whisper.yml
      - scripts/build-whisper.ts
      - scripts/test-whisper-gpu.ts
      - scripts/whisper-patches/**
      - scripts/whisper-release.ts
      - scripts/whisper-release/**
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable Whisper runtime release tag (for example, whisper-v0.0.1)
        required: true
        type: string

permissions:
  contents: read

env:
  RUNTIME_TAG: ${{ inputs.runtime_tag }}

jobs:
  preflight:
    name: Validate runtime release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        if: github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch'
        run: bun install --frozen-lockfile
      - name: Validate runtime tag syntax
        if: github.event_name == 'workflow_dispatch'
        run: bun run scripts/whisper-release.ts validate-tag --tag "$RUNTIME_TAG"
      - name: Confirm runtime tag is unpublished
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run scripts/whisper-release.ts assert-release-available
          --repository "$GITHUB_REPOSITORY" --tag "$RUNTIME_TAG"

  build-linux-x64:
    name: Build Whisper runtime (linux-x64)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "x86_64"
      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
      - name: Build pinned verified Whisper source
        run: bun run scripts/build-whisper.ts
      - name: Verify Linux build configuration and runtime dependencies
        run: |
          set -euo pipefail
          grep -Fxq 'GGML_NATIVE:BOOL=OFF' build-whisper/build/CMakeCache.txt
          grep -Fxq 'GGML_VULKAN:BOOL=ON' build-whisper/build/CMakeCache.txt
          ldd_output="$(ldd build-whisper/whisper-server 2>&1 || true)"
          printf '%s\n' "$ldd_output"
          ! grep -q "not found" <<<"$ldd_output"
          grep -q "libvulkan.so.1" <<<"$ldd_output"
      - name: Create canonical Linux archive
        run: |
          tar -czf whisper-server-linux-x64.tar.gz -C build-whisper whisper-server LICENSE.whisper.cpp.txt
          test "$(tar -tzf whisper-server-linux-x64.tar.gz)" = "$(printf '%s\n' whisper-server LICENSE.whisper.cpp.txt)"
      - name: Qualify Linux archive
        run: >-
          bun run scripts/whisper-release.ts qualify-archive
          --target linux-x64 --archive whisper-server-linux-x64.tar.gz
          --work-directory "$RUNNER_TEMP/whisper-linux-x64"
      - name: Upload Linux runtime archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whisper-runtime-linux-x64
          path: whisper-server-linux-x64.tar.gz

  build-macos-arm64:
    name: Build Whisper runtime (macos-arm64)
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Build pinned verified Whisper source
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: bun run scripts/build-whisper.ts
      - name: Runs on macOS 14 and later
        run: |
          minos="$(vtool -show-build build-whisper/whisper-server | awk '/minos/ {print $2}')"
          echo "minimum macOS: $minos"
          test "$minos" = 14.0
      - name: Verify precompiled Metal library
        run: |
          set -euo pipefail
          grep -Fxq 'GGML_METAL_EMBED_PRECOMPILED:BOOL=ON' build-whisper/build/CMakeCache.txt
          otool -l build-whisper/whisper-server | grep -F '__ggml_metalbin' >/dev/null
          strings build-whisper/whisper-server | grep -F 'using precompiled embedded metal library' >/dev/null
      - name: Keep the unsigned runtime for signing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whisper-unsigned-macos-arm64
          path: |
            build-whisper/whisper-server
            build-whisper/LICENSE.whisper.cpp.txt
          if-no-files-found: error

  sign-macos-arm64:
    name: Sign Whisper runtime (macos-arm64)
    # This job holds the signing key, so it runs nothing from the repository or the build: only
    # Apple's tools on what the build left. scripts/check-signing-jobs.sh keeps it that way.
    needs: build-macos-arm64
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Fetch the unsigned runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whisper-unsigned-macos-arm64
          path: unsigned
      - name: Import the signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Sign and archive
        run: |
          set -euo pipefail
          chmod 755 unsigned/whisper-server
          codesign --force --options runtime --timestamp --sign "Developer ID Application:" unsigned/whisper-server
          zip -j whisper-server-macos-arm64.zip unsigned/whisper-server unsigned/LICENSE.whisper.cpp.txt
          test "$(unzip -Z1 whisper-server-macos-arm64.zip)" = "$(printf '%s\n' whisper-server LICENSE.whisper.cpp.txt)"
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcrun notarytool submit whisper-server-macos-arm64.zip
          --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
      - name: Keep the signed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whisper-signed-macos-arm64
          path: whisper-server-macos-arm64.zip
          if-no-files-found: error
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  qualify-macos-arm64:
    name: Qualify Whisper runtime (macos-arm64)
    needs: sign-macos-arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch the signed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whisper-signed-macos-arm64
      - name: Qualify the signed and notarized archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          bun run scripts/whisper-release.ts qualify-archive
          --target macos-arm64 --archive whisper-server-macos-arm64.zip
          --work-directory "$RUNNER_TEMP/whisper-macos-arm64" --team-id "$TEAM_ID"
      - name: Keep the qualified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whisper-runtime-macos-arm64
          path: whisper-server-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish qualified Whisper runtime
    needs: [build-linux-x64, qualify-macos-arm64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Linux runtime archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whisper-runtime-linux-x64
          path: release
      - name: Download macOS runtime archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whisper-runtime-macos-arm64
          path: release
      - name: Generate runtime checksums
        run: |
          cd release
          sha256sum whisper-server-macos-arm64.zip whisper-server-linux-x64.tar.gz > checksums.txt
      - name: Attest runtime archives and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/whisper-server-macos-arm64.zip
            release/whisper-server-linux-x64.tar.gz
            release/checksums.txt
      - name: Publish immutable Whisper release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RUNTIME_TAG"
          release/whisper-server-macos-arm64.zip
          release/whisper-server-linux-x64.tar.gz release/checksums.txt
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RUNTIME_TAG" --latest=false

  sync-manifest:
    name: Synchronize managed runtime manifest
    needs: release
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sync-whisper-manifest.yml
    with:
      runtime_tag: ${{ inputs.runtime_tag }}
    secrets: inherit
