name: Release Whisper Runtime

on:
  push:
    tags:
      - "whisper-v*"
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable Whisper runtime release tag (for example, whisper-v1.0.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RUNTIME_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime_tag || github.ref_name }}

jobs:
  preflight:
    name: Validate runtime release tag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate immutable runtime tag
        run: bun run scripts/release-preflight.ts --runtime-tag "$RUNTIME_TAG"

  build-linux-x64:
    name: Build Whisper runtime (linux-x64)
    needs: preflight
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "x86_64"

      - name: Build pinned verified Whisper source
        run: bun run scripts/build-whisper.ts

      - name: Verify Linux runtime architecture and dependencies
        run: |
          set -euo pipefail
          runtime=build-whisper/whisper-server
          machine="$(readelf -h "$runtime" | awk -F: '$1 ~ /^[[:space:]]*Machine$/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}')"
          test "$machine" = "Advanced Micro Devices X86-64"
          ldd_output="$(ldd "$runtime" 2>&1 || true)"
          printf '%s\n' "$ldd_output"
          ! grep -q "not found" <<<"$ldd_output"

      - name: Create root-level Linux package
        run: |
          tar -czf whisper-server-linux-x64.tar.gz -C build-whisper whisper-server
          test "$(tar -tzf whisper-server-linux-x64.tar.gz)" = "whisper-server"

      - name: Upload Linux runtime package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whisper-runtime-linux-x64
          path: whisper-server-linux-x64.tar.gz

  build-macos-arm64:
    name: Build Whisper runtime (macos-arm64)
    needs: preflight
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Import Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: temporary-keychain-pass
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Build pinned verified Whisper source
        run: bun run scripts/build-whisper.ts

      - name: Sign hardened macOS runtime
        run: codesign --force --options runtime --timestamp --sign "Developer ID Application:" build-whisper/whisper-server

      - name: Create and notarize root-level macOS package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j whisper-server-macos-arm64.zip build-whisper/whisper-server
          test "$(unzip -Z1 whisper-server-macos-arm64.zip)" = "whisper-server"
          xcrun notarytool submit whisper-server-macos-arm64.zip --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait

      - name: Verify macOS package and runtime trust
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q whisper-server-macos-arm64.zip -d extracted
          runtime=extracted/whisper-server
          test "$(lipo -archs "$runtime")" = "arm64"
          codesign --verify --strict --verbose=2 "$runtime"
          spctl --assess --type execute "$runtime"

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload macOS runtime package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whisper-runtime-macos-arm64
          path: whisper-server-macos-arm64.zip

  release:
    name: Publish Qualified Whisper Runtime
    needs: [build-linux-x64, build-macos-arm64]
    if: >-
      needs.build-linux-x64.result == 'success' &&
      needs.build-macos-arm64.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux runtime package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: whisper-runtime-linux-x64
          path: release

      - name: Download macOS runtime package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: whisper-runtime-macos-arm64
          path: release

      - name: Generate runtime checksums
        run: |
          cd release
          sha256sum whisper-server-macos-arm64.zip whisper-server-linux-x64.tar.gz > checksums.txt

      - name: Attest runtime packages and checksums
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/whisper-server-macos-arm64.zip
            release/whisper-server-linux-x64.tar.gz
            release/checksums.txt

      - name: Publish Whisper runtime release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RUNTIME_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            release/whisper-server-macos-arm64.zip
            release/whisper-server-linux-x64.tar.gz
            release/checksums.txt
