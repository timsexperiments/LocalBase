name: Release Whisper Runtime

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable Whisper runtime release tag (for example, whisper-v0.0.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RUNTIME_TAG: ${{ inputs.runtime_tag }}

jobs:
  preflight:
    name: Validate runtime release tag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate runtime tag syntax
        run: bun run scripts/whisper-release.ts validate-tag --tag "$RUNTIME_TAG"
      - name: Confirm runtime tag is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run scripts/whisper-release.ts assert-release-available
          --repository "$GITHUB_REPOSITORY" --tag "$RUNTIME_TAG"

  build-linux-x64:
    name: Build Whisper runtime (linux-x64)
    needs: preflight
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "x86_64"
      - name: Build pinned verified Whisper source
        run: bun run scripts/build-whisper.ts
      - name: Verify Linux runtime dependencies
        run: |
          set -euo pipefail
          ldd_output="$(ldd build-whisper/whisper-server 2>&1 || true)"
          printf '%s\n' "$ldd_output"
          ! grep -q "not found" <<<"$ldd_output"
      - name: Create canonical Linux archive
        run: |
          tar -czf whisper-server-linux-x64.tar.gz -C build-whisper whisper-server
          test "$(tar -tzf whisper-server-linux-x64.tar.gz)" = "whisper-server"
      - name: Qualify Linux archive
        run: >-
          bun run scripts/whisper-release.ts qualify-archive
          --target linux-x64 --archive whisper-server-linux-x64.tar.gz
          --work-directory "$RUNNER_TEMP/whisper-linux-x64"
      - name: Upload Linux runtime archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisper-runtime-linux-x64
          path: whisper-server-linux-x64.tar.gz

  build-macos-arm64:
    name: Build Whisper runtime (macos-arm64)
    needs: preflight
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Import Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: temporary-keychain-pass
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH
      - name: Build pinned verified Whisper source
        run: bun run scripts/build-whisper.ts
      - name: Sign hardened macOS runtime
        run: codesign --force --options runtime --timestamp --sign "Developer ID Application:" build-whisper/whisper-server
      - name: Create canonical macOS archive
        run: |
          zip -j whisper-server-macos-arm64.zip build-whisper/whisper-server
          test "$(unzip -Z1 whisper-server-macos-arm64.zip)" = "whisper-server"
      - name: Notarize macOS archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcrun notarytool submit whisper-server-macos-arm64.zip
          --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
      - name: Qualify macOS archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          bun run scripts/whisper-release.ts qualify-archive
          --target macos-arm64 --archive whisper-server-macos-arm64.zip
          --work-directory "$RUNNER_TEMP/whisper-macos-arm64" --team-id "$TEAM_ID"
      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
      - name: Upload macOS runtime archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whisper-runtime-macos-arm64
          path: whisper-server-macos-arm64.zip

  release:
    name: Publish qualified Whisper runtime
    needs: [build-linux-x64, build-macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux runtime archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: whisper-runtime-linux-x64
          path: release
      - name: Download macOS runtime archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: whisper-runtime-macos-arm64
          path: release
      - name: Generate runtime checksums
        run: |
          cd release
          sha256sum whisper-server-macos-arm64.zip whisper-server-linux-x64.tar.gz > checksums.txt
      - name: Attest runtime archives and checksums
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/whisper-server-macos-arm64.zip
            release/whisper-server-linux-x64.tar.gz
            release/checksums.txt
      - name: Publish immutable Whisper release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RUNTIME_TAG"
          release/whisper-server-macos-arm64.zip
          release/whisper-server-linux-x64.tar.gz release/checksums.txt
          --target "$GITHUB_SHA" --title "$RUNTIME_TAG"

  sync-manifest:
    name: Synchronize managed runtime manifest
    needs: release
    uses: ./.github/workflows/sync-whisper-manifest.yml
    with:
      runtime_tag: ${{ inputs.runtime_tag }}
    secrets: inherit
