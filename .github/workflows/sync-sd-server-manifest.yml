name: Synchronize sd-server Runtime Manifest

on:
  workflow_call:
    inputs:
      runtime_tag:
        description: Immutable published sd-server runtime release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable published sd-server runtime release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Validate release tag
        id: runtime
        env:
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: >-
          bun run scripts/sd-release.ts validate-tag --tag "$RUNTIME_TAG"
          --github-output "$GITHUB_OUTPUT"
      - name: Verify published release and write immutable receipt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          bun run scripts/sd-release.ts verify-published-release
          --repository "$GITHUB_REPOSITORY" --tag "${{ steps.runtime.outputs.tag }}"
          --output "$RUNNER_TEMP/sd-server-release-receipt.json"
      - name: Reconcile manifest branch from current default branch
        id: branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MANIFEST_BRANCH: ${{ steps.runtime.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "LocalBase Release Automation"
          git config user.email "release-automation@users.noreply.github.com"
          git fetch origin "$BASE_BRANCH"
          remote_line="$(git ls-remote --heads origin "refs/heads/$MANIFEST_BRANCH")"
          if [ -n "$remote_line" ]; then
            remote_sha="${remote_line%% *}"
            printf '%s\n' "$remote_sha" > "$RUNNER_TEMP/sd-manifest-remote-sha"
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
          git switch --create "$MANIFEST_BRANCH" "origin/$BASE_BRANCH"
      - name: Update and verify only sd-server manifest entries
        run: |
          bun run scripts/sd-release.ts update-manifest \
            --manifest src/manager/managed-runtime-manifest.json \
            --receipt "$RUNNER_TEMP/sd-server-release-receipt.json"
          bun run scripts/sd-release.ts verify-manifest \
            --manifest src/manager/managed-runtime-manifest.json \
            --receipt "$RUNNER_TEMP/sd-server-release-receipt.json"
      - name: Commit manifest update
        id: commit
        env:
          RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
        run: |
          if git diff --quiet -- src/manager/managed-runtime-manifest.json; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            git add src/manager/managed-runtime-manifest.json
            git commit -m "chore: pin $RUNTIME_TAG sd-server runtime archives"
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Push manifest branch
        if: steps.commit.outputs.changed == 'true'
        env:
          MANIFEST_BRANCH: ${{ steps.runtime.outputs.branch }}
          BRANCH_EXISTS: ${{ steps.branch.outputs.exists }}
        run: |
          if [ "$BRANCH_EXISTS" = "false" ]; then
            git push origin "HEAD:refs/heads/$MANIFEST_BRANCH"
          else
            remote_sha="$(cat "$RUNNER_TEMP/sd-manifest-remote-sha")"
            git push --force-with-lease="refs/heads/$MANIFEST_BRANCH:$remote_sha" origin "HEAD:refs/heads/$MANIFEST_BRANCH"
          fi
      - name: Open or update manifest pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          MANIFEST_BRANCH: ${{ steps.runtime.outputs.branch }}
          RUNTIME_TAG: ${{ steps.runtime.outputs.tag }}
        run: |
          pr_number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$MANIFEST_BRANCH" --jq '.[0].number')"
          title="chore: pin $RUNTIME_TAG sd-server runtime archives"
          body="Pins verified sd-server runtime archive metadata from $RUNTIME_TAG."
          if [ -n "$pr_number" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr_number" -f title="$title" -f body="$body" >/dev/null
          else
            gh pr create --base "$BASE_BRANCH" --head "$MANIFEST_BRANCH" --title "$title" --body "$body"
          fi
