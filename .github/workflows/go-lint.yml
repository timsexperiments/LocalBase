name: Go lint

# The Go code owns the config. A missing config fails this job; it never passes without linting.
on:
  pull_request:
    paths: ["go/**", ".github/workflows/go-lint.yml"]
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/go-lint.yml"]
  schedule:
    # A new advisory should show up without anyone pushing.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # Relative to go/.
  GOLANGCI_CONFIG: .golangci.yml

# A new push to a pull request cancels that pull request's older run. Any other event gets a
# group of its own, so a push to main, a tag, a schedule or a dispatch is never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: go
          args: --config=${{ env.GOLANGCI_CONFIG }}
      - name: Known vulnerabilities
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
