name: Repo guards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Any other event gets a
# group of its own, so a push to main, a tag, a schedule or a dispatch is never cancelled or dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard rejects what it should
        run: scripts/check-repo-hygiene.test.sh
      - name: Binaries, large files, workflow pins and permissions
        run: scripts/check-repo-hygiene.sh

  licensing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        # At the version and checksum in scripts/tools.pins, outside the checkout it scans.
        run: LOCALBASE_TOOLS_DIR="$RUNNER_TEMP/tools" scripts/bootstrap.sh gitleaks
      - name: Every allowlist entry is one exact value with a reason
        run: scripts/check-gitleaks-allowlist.test.sh && scripts/check-gitleaks-allowlist.sh
      - name: Scan the working tree
        run: '"$RUNNER_TEMP/tools/bin/gitleaks" dir . --no-banner --redact --config .gitleaks.toml'
      - name: Scan the new commits
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: '"$RUNNER_TEMP/tools/bin/gitleaks" git . --no-banner --redact --config .gitleaks.toml --log-opts="$RANGE"'
