name: Matrix test (throwaway)
on:
  pull_request:
permissions:
  contents: read
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Chat and speech for real on a GPU-less Linux x64 machine
        run: |
          (cd go && CGO_ENABLED=0 go build -buildvcs=false -o "$RUNNER_TEMP/lb" ./cmd/localbase)
          export LOCALBASE_ROOT="$RUNNER_TEMP/root"
          lb(){ "$RUNNER_TEMP/lb" --non-interactive "$@"; }
          free -m | head -2
          lb init > /dev/null
          echo "=== as installed: free figures seen by LocalBase"; lb doctor 2>&1 | grep -E 'RAM|Status' | cut -c1-110 || true
          echo "=== config show, memory"; lb config show 2>&1 | sed -n '/^\[memory/,+4p' | cut -c1-70 || true
          lb config show > "$RUNNER_TEMP/c.toml"
          sed -i -E '/^allowExperimental = /d; s/^\[models\]$/[models]\nallowExperimental = true/; /^\[memory\.systemReserve\]/,/^\[/ { s/^percent = .*/percent = 5/; s/^minimumGb = .*/minimumGb = 1/; s/^minGb = .*/minGb = 1/ }; s/^selectedTtsModels = .*/selectedTtsModels = ["kokoro-82m-v1.0-q8"]/; s/^activeTtsModel = .*/activeTtsModel = "kokoro-82m-v1.0-q8"/' "$RUNNER_TEMP/c.toml"
          echo "=== config apply"; lb config apply --file "$RUNNER_TEMP/c.toml" --restart never 2>&1 | tail -3 | cut -c1-140 || true
          lb config show 2>&1 | grep -nE 'allowExperimental|^percent|^minimum|^min|selectedTts|activeTts' | cut -c1-90 || true
          key="$(lb keys create --name t --scopes inference:chat,inference:speech,models:read,models:manage 2>/dev/null | sed -nE 's/^secret=//p')"
          s=$(date +%s); echo "=== install chat"; lb models install qwen3.5-4b-q4_k_m 2>&1 | tail -1 | cut -c1-110 || true; echo "$(( $(date +%s)-s ))s"
          echo "=== backend, chat, installed"; lb models backend qwen3.5-4b-q4_k_m 2>&1 | head -5 | cut -c1-130 || true
          s=$(date +%s); echo "=== install kokoro"; lb models install kokoro-82m-v1.0-q8 2>&1 | tail -1 | cut -c1-110 || true; echo "$(( $(date +%s)-s ))s"
          echo "=== backend, kokoro, installed"; lb models backend kokoro-82m-v1.0-q8 2>&1 | head -8 | cut -c1-150 || true
          lb serve --host 127.0.0.1 --port 26800 --llm-port 26801 --tts-port 26802 > "$RUNNER_TEMP/serve.log" 2>&1 &
          g=$!
          for i in $(seq 1 60); do curl -fsS -m1 -o /dev/null http://127.0.0.1:26800/health 2>/dev/null && break; sleep 1; done
          post(){ curl -s -m "$3" -o "$RUNNER_TEMP/o" -w '%{http_code} %{size_download}B %{time_total}s' "http://127.0.0.1:26800$1" -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d "$2"; echo " code=$(jq -r '.error.code // "-"' "$RUNNER_TEMP/o" 2>/dev/null | head -1) msg=$(jq -r '.error.message // "-"' "$RUNNER_TEMP/o" 2>/dev/null | cut -c1-130 | head -1)"; }
          free -m | sed -n 2p
          echo "=== chat, automatic"; post /v1/chat/completions '{"model":"qwen3.5-4b-q4_k_m","max_tokens":64,"messages":[{"role":"user","content":"Say hello."}]}' 600
          jq -c '{finish:.choices[0].finish_reason,content_len:(.choices[0].message.content|length),reasoning_len:(.choices[0].message.reasoning|length)}' "$RUNNER_TEMP/o" 2>/dev/null || true
          echo "=== model-backend now"; curl -s -m5 -H "Authorization: Bearer $key" 'http://127.0.0.1:26800/_localbase/model-backend?model=qwen3.5-4b-q4_k_m' | jq -c '[paths(scalars) as $p|select($p[-1]|tostring|test("id|mode|selected|effective";"i"))|[$p[-1],getpath($p)]][:6]' 2>/dev/null | cut -c1-170 || true
          echo "=== speech kokoro, automatic"; post /v1/audio/speech '{"model":"kokoro-82m-v1.0-q8","input":"hello there","voice":"af_heart"}' 300
          echo "=== choose onnx-cpu"; curl -s -m10 -o "$RUNNER_TEMP/o" -w '%{http_code}\n' http://127.0.0.1:26800/_localbase/model-backend -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"action":"set","model":"kokoro-82m-v1.0-q8","backendId":"onnx-cpu"}'; jq -c '.error // "ok"' "$RUNNER_TEMP/o" | cut -c1-170
          echo "=== speech kokoro, onnx-cpu"; post /v1/audio/speech '{"model":"kokoro-82m-v1.0-q8","input":"hello there","voice":"af_heart"}' 300
          file "$RUNNER_TEMP/o" | cut -d: -f2 | cut -c1-80
          echo "=== runtimes on disk"; ls "$LOCALBASE_ROOT/bin/runtimes" 2>/dev/null | tr '\n' ' '; echo
          echo "=== refusals in the log"; grep -E '"severity":"(warn|error)"' "$RUNNER_TEMP/serve.log" | jq -r '[.eventName,(.message|.[0:100])]|join(" | ")' 2>/dev/null | sort | uniq -c | sort -rn | head -8 | cut -c1-150 || true
          kill "$g" 2>/dev/null || true
