name: Build sd-server Runtime

on:
  pull_request:
    paths:
      - .github/workflows/release-sd-server.yml
      - scripts/runtimes/build-sd-server.ts
      - scripts/runtimes/sd-release.ts
      - scripts/runtimes/sd-release.test.ts
      - scripts/runtimes/sd-release/**
      - scripts/runtimes/sd-patches/**
      - .github/workflows/sync-sd-server-manifest.yml
      - go/internal/runtime/video.go
      - go/internal/runtime/video_args_test.go
      - .github/actions/go-setup/**
      - scripts/runtimes/sd-gpu-pci-contract.ts
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable sd-server runtime tag (for example, sd-server-v0.0.1)
        required: true
        type: string

permissions:
  contents: read

env:
  RUNTIME_TAG: ${{ inputs.runtime_tag }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test scripts/runtimes/sd-release.test.ts
      - name: Validate unpublished release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run scripts/runtimes/sd-release.ts validate-tag --tag "$RUNTIME_TAG"
          bun run scripts/runtimes/sd-release.ts assert-release-available \
            --repository "$GITHUB_REPOSITORY" --tag "$RUNTIME_TAG"

  linux-x64:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libvulkan-dev glslc spirv-headers
      - name: Build verified patched source
        run: bun run scripts/runtimes/build-sd-server.ts
      - name: Verify Vulkan configuration and runtime linkage
        run: |
          grep -Fxq 'GGML_NATIVE:BOOL=OFF' build-sd-server/build/CMakeCache.txt
          grep -Fxq 'SD_VULKAN:BOOL=ON' build-sd-server/build/CMakeCache.txt
          ldd_output="$(ldd build-sd-server/sd-server 2>&1 || true)"
          printf '%s\n' "$ldd_output"
          ! grep -q 'not found' <<<"$ldd_output"
          grep -q 'libvulkan.so.1' <<<"$ldd_output"
          ! grep -Eq 'libwebp|libwebm|libggml' <<<"$ldd_output"
          build-sd-server/sd-server --help >/dev/null
          strings build-sd-server/sd-server | grep -Fxq 'inline_wav_audio'
          strings build-sd-server/sd-server | grep -Fxq 'WAV must contain PCM16 or IEEE float32 samples'
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: It accepts the gateway's video launch arguments
        # The Go launcher's own arguments (internal/runtime sdVideoArgs), run against this binary with
        # --help. It must pass, not skip: a skip would mean the binary went unchecked.
        working-directory: go
        env:
          LOCALBASE_SD_SERVER_BINARY: ${{ github.workspace }}/build-sd-server/sd-server
        run: |
          set -o pipefail
          go test -count=1 -run '^TestSDServerAcceptsVideoArgs$' -v ./internal/runtime | tee "$RUNNER_TEMP/sd-video-args.log"
          grep -q '^--- PASS: TestSDServerAcceptsVideoArgs ' "$RUNNER_TEMP/sd-video-args.log" || { echo "TestSDServerAcceptsVideoArgs did not pass (skipped or not found)"; exit 1; }
      - name: Package and qualify canonical archive
        run: |
          cp build-sd-server/SOURCE.sd-server.json SOURCE.sd-server.json
          tar -czf sd-server-linux-x64.tar.gz -C build-sd-server \
            sd-server SOURCE.sd-server.json \
            LICENSE.darts-clone.txt LICENSE.ggml.txt LICENSE.libwebm.txt \
            LICENSE.libwebp.txt LICENSE.nlohmann-json.txt LICENSE.oniguruma.txt \
            LICENSE.stable-diffusion.cpp.txt LICENSE.utf8proc.txt
          mkdir -p "$RUNNER_TEMP/sd-linux-x64"
          bun run scripts/runtimes/sd-release.ts qualify-archive \
            --target linux-x64 --archive sd-server-linux-x64.tar.gz \
            --work-directory "$RUNNER_TEMP/sd-linux-x64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sd-server-runtime-linux-x64
          path: |
            sd-server-linux-x64.tar.gz
            SOURCE.sd-server.json

  macos-arm64:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build verified patched source
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: bun run scripts/runtimes/build-sd-server.ts
      - name: Runs on macOS 14 and later
        run: |
          minos="$(vtool -show-build build-sd-server/sd-server | awk '/minos/ {print $2}')"
          echo "minimum macOS: $minos"
          test "$minos" = 14.0
      - name: Verify Metal configuration and standalone runtime
        run: |
          test "$(uname -m)" = arm64
          grep -Fxq 'GGML_NATIVE:BOOL=OFF' build-sd-server/build/CMakeCache.txt
          grep -Fxq 'SD_METAL:BOOL=ON' build-sd-server/build/CMakeCache.txt
          grep -Fxq 'GGML_METAL_EMBED_PRECOMPILED:BOOL=ON' build-sd-server/build/CMakeCache.txt
          otool -l build-sd-server/sd-server | grep -F '__ggml_metalbin' >/dev/null
          strings build-sd-server/sd-server | grep -F 'using precompiled embedded metal library' >/dev/null
          ! otool -L build-sd-server/sd-server | grep -Eq 'libwebp|libwebm|libggml'
          build-sd-server/sd-server --help >/dev/null
          strings build-sd-server/sd-server | grep -Fxq 'inline_wav_audio'
          strings build-sd-server/sd-server | grep -Fxq 'WAV must contain PCM16 or IEEE float32 samples'
      - name: Set up Go
        uses: ./.github/actions/go-setup
      - name: It accepts the gateway's video launch arguments
        # The Go launcher's own arguments (internal/runtime sdVideoArgs), run against this binary with
        # --help. It must pass, not skip: a skip would mean the binary went unchecked.
        working-directory: go
        env:
          LOCALBASE_SD_SERVER_BINARY: ${{ github.workspace }}/build-sd-server/sd-server
        run: |
          set -o pipefail
          go test -count=1 -run '^TestSDServerAcceptsVideoArgs$' -v ./internal/runtime | tee "$RUNNER_TEMP/sd-video-args.log"
          grep -q '^--- PASS: TestSDServerAcceptsVideoArgs ' "$RUNNER_TEMP/sd-video-args.log" || { echo "TestSDServerAcceptsVideoArgs did not pass (skipped or not found)"; exit 1; }
      - name: Package canonical archive
        run: |
          cd build-sd-server
          zip -j ../sd-server-macos-arm64.zip \
            sd-server SOURCE.sd-server.json \
            LICENSE.darts-clone.txt LICENSE.ggml.txt LICENSE.libwebm.txt \
            LICENSE.libwebp.txt LICENSE.nlohmann-json.txt LICENSE.oniguruma.txt \
            LICENSE.stable-diffusion.cpp.txt LICENSE.utf8proc.txt
      - name: Qualify canonical archive
        if: github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/sd-macos-arm64"
          bun run scripts/runtimes/sd-release.ts qualify-archive \
            --target macos-arm64 --archive sd-server-macos-arm64.zip \
            --work-directory "$RUNNER_TEMP/sd-macos-arm64"
      - name: Keep the unsigned archive for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sd-server-unsigned-macos-arm64
          path: sd-server-macos-arm64.zip
          if-no-files-found: error

  sign-macos-arm64:
    name: Sign sd-server runtime (macos-arm64)
    # This job holds the signing key, so it runs nothing from the repository or the build: only
    # Apple's tools on what the build left. scripts/check-signing-jobs.sh keeps it that way.
    needs: macos-arm64
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Fetch the unsigned runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sd-server-unsigned-macos-arm64
          path: unsigned
      - name: Import the signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Sign and archive
        run: |
          set -euo pipefail
          unzip -q unsigned/sd-server-macos-arm64.zip -d unpacked
          chmod 755 unpacked/sd-server
          codesign --force --options runtime --timestamp --sign "Developer ID Application:" unpacked/sd-server
          # The same files in the same order, with the runtime now signed.
          unzip -Z1 unsigned/sd-server-macos-arm64.zip | sed 's|^|unpacked/|' | zip -j -@ sd-server-macos-arm64.zip
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcrun notarytool submit sd-server-macos-arm64.zip
          --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
      - name: Keep the signed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sd-server-signed-macos-arm64
          path: sd-server-macos-arm64.zip
          if-no-files-found: error
      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  qualify-macos-arm64:
    name: Qualify sd-server runtime (macos-arm64)
    needs: sign-macos-arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Fetch the signed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sd-server-signed-macos-arm64
      - name: Qualify the signed and notarized archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          bun run scripts/runtimes/sd-release.ts qualify-archive
          --target macos-arm64 --archive sd-server-macos-arm64.zip
          --work-directory "$RUNNER_TEMP/sd-macos-arm64" --team-id "$TEAM_ID"
      - name: Keep the qualified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sd-server-runtime-macos-arm64
          path: sd-server-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish qualified sd-server runtime
    needs: [linux-x64, qualify-macos-arm64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sd-server-runtime-linux-x64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sd-server-runtime-macos-arm64
          path: release
      - name: Generate canonical checksums
        run: |
          cd release
          sha256sum sd-server-macos-arm64.zip sd-server-linux-x64.tar.gz > checksums.txt
      - name: Attest runtime archives and release identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/sd-server-macos-arm64.zip
            release/sd-server-linux-x64.tar.gz
            release/SOURCE.sd-server.json
            release/checksums.txt
      - name: Publish immutable non-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RUNTIME_TAG"
          release/sd-server-macos-arm64.zip release/sd-server-linux-x64.tar.gz
          release/SOURCE.sd-server.json release/checksums.txt
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$RUNTIME_TAG" --latest=false

  sync-manifest:
    name: Synchronize managed runtime manifest
    needs: release
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sync-sd-server-manifest.yml
    with:
      runtime_tag: ${{ inputs.runtime_tag }}
    secrets: inherit
