name: Build sd-server Runtime

on:
  pull_request:
    paths:
      - .github/workflows/release-sd-server.yml
      - scripts/build-sd-server.ts
      - scripts/sd-release.ts
      - scripts/sd-release.test.ts
      - scripts/sd-release/**
      - scripts/sd-patches/**
      - .github/workflows/sync-sd-server-manifest.yml
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Immutable sd-server runtime tag (for example, sd-server-v0.0.1)
        required: true
        type: string

permissions:
  contents: read

env:
  RUNTIME_TAG: ${{ inputs.runtime_tag }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test scripts/sd-release.test.ts
      - name: Validate unpublished release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run scripts/sd-release.ts validate-tag --tag "$RUNTIME_TAG"
          bun run scripts/sd-release.ts assert-release-available \
            --repository "$GITHUB_REPOSITORY" --tag "$RUNTIME_TAG"

  linux-x64:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install pinned build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libvulkan-dev glslc spirv-headers
      - name: Build verified patched source
        run: bun run scripts/build-sd-server.ts
      - name: Verify Vulkan configuration and runtime linkage
        run: |
          grep -Fxq 'GGML_NATIVE:BOOL=OFF' build-sd-server/build/CMakeCache.txt
          grep -Fxq 'SD_VULKAN:BOOL=ON' build-sd-server/build/CMakeCache.txt
          ldd_output="$(ldd build-sd-server/sd-server 2>&1 || true)"
          printf '%s\n' "$ldd_output"
          ! grep -q 'not found' <<<"$ldd_output"
          grep -q 'libvulkan.so.1' <<<"$ldd_output"
          ! grep -Eq 'libwebp|libwebm|libggml' <<<"$ldd_output"
          build-sd-server/sd-server --help >/dev/null
          strings build-sd-server/sd-server | grep -Fxq 'inline_wav_audio'
          strings build-sd-server/sd-server | grep -Fxq 'WAV must contain PCM16 or IEEE float32 samples'
      - name: Package and qualify canonical archive
        run: |
          cp build-sd-server/SOURCE.sd-server.json SOURCE.sd-server.json
          tar -czf sd-server-linux-x64.tar.gz -C build-sd-server \
            sd-server SOURCE.sd-server.json \
            LICENSE.darts-clone.txt LICENSE.ggml.txt LICENSE.libwebm.txt \
            LICENSE.libwebp.txt LICENSE.nlohmann-json.txt LICENSE.oniguruma.txt \
            LICENSE.stable-diffusion.cpp.txt LICENSE.utf8proc.txt
          mkdir -p "$RUNNER_TEMP/sd-linux-x64"
          bun run scripts/sd-release.ts qualify-archive \
            --target linux-x64 --archive sd-server-linux-x64.tar.gz \
            --work-directory "$RUNNER_TEMP/sd-linux-x64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sd-server-runtime-linux-x64
          path: |
            sd-server-linux-x64.tar.gz
            SOURCE.sd-server.json

  macos-arm64:
    needs: preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Import Apple signing certificate
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          KEYCHAIN_PASSWORD: temporary-keychain-pass
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
      - name: Build verified patched source
        run: bun run scripts/build-sd-server.ts
      - name: Verify Metal configuration and standalone runtime
        run: |
          test "$(uname -m)" = arm64
          grep -Fxq 'GGML_NATIVE:BOOL=OFF' build-sd-server/build/CMakeCache.txt
          grep -Fxq 'SD_METAL:BOOL=ON' build-sd-server/build/CMakeCache.txt
          ! otool -L build-sd-server/sd-server | grep -Eq 'libwebp|libwebm|libggml'
          build-sd-server/sd-server --help >/dev/null
          strings build-sd-server/sd-server | grep -Fxq 'inline_wav_audio'
          strings build-sd-server/sd-server | grep -Fxq 'WAV must contain PCM16 or IEEE float32 samples'
      - name: Sign hardened macOS runtime
        if: github.event_name == 'workflow_dispatch'
        run: codesign --force --options runtime --timestamp --sign "Developer ID Application:" build-sd-server/sd-server
      - name: Package canonical archive
        run: |
          cd build-sd-server
          zip -j ../sd-server-macos-arm64.zip \
            sd-server SOURCE.sd-server.json \
            LICENSE.darts-clone.txt LICENSE.ggml.txt LICENSE.libwebm.txt \
            LICENSE.libwebp.txt LICENSE.nlohmann-json.txt LICENSE.oniguruma.txt \
            LICENSE.stable-diffusion.cpp.txt LICENSE.utf8proc.txt
      - name: Qualify canonical archive
        if: github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/sd-macos-arm64"
          bun run scripts/sd-release.ts qualify-archive \
            --target macos-arm64 --archive sd-server-macos-arm64.zip \
            --work-directory "$RUNNER_TEMP/sd-macos-arm64"
      - name: Notarize macOS archive
        if: github.event_name == 'workflow_dispatch'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcrun notarytool submit sd-server-macos-arm64.zip
          --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$TEAM_ID" --wait
      - name: Qualify signed and notarized macOS archive
        if: github.event_name == 'workflow_dispatch'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          bun run scripts/sd-release.ts qualify-archive
          --target macos-arm64 --archive sd-server-macos-arm64.zip
          --work-directory "$RUNNER_TEMP/sd-macos-arm64" --team-id "$TEAM_ID"
      - name: Clean up temporary keychain
        if: always() && github.event_name == 'workflow_dispatch'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sd-server-runtime-macos-arm64
          path: sd-server-macos-arm64.zip

  release:
    name: Publish qualified sd-server runtime
    needs: [linux-x64, macos-arm64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sd-server-runtime-linux-x64
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sd-server-runtime-macos-arm64
          path: release
      - name: Generate canonical checksums
        run: |
          cd release
          sha256sum sd-server-macos-arm64.zip sd-server-linux-x64.tar.gz > checksums.txt
      - name: Attest runtime archives and release identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/sd-server-macos-arm64.zip
            release/sd-server-linux-x64.tar.gz
            release/SOURCE.sd-server.json
            release/checksums.txt
      - name: Publish immutable non-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RUNTIME_TAG"
          release/sd-server-macos-arm64.zip release/sd-server-linux-x64.tar.gz
          release/SOURCE.sd-server.json release/checksums.txt
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$RUNTIME_TAG" --latest=false

  sync-manifest:
    name: Synchronize managed runtime manifest
    needs: release
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sync-sd-server-manifest.yml
    with:
      runtime_tag: ${{ inputs.runtime_tag }}
    secrets: inherit
